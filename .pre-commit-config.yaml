repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        exclude: ^tests/fixtures/
      - id: terraform_trivy
        exclude: ^tests/fixtures/
        args:
          - --args=--skip-dirs=tests/fixtures

  - repo: local
    hooks:
      - id: terraform_test
        name: Terraform test
        entry: bash -c 'terraform init -backend=false -input=false >/dev/null && terraform test'
        language: system
        pass_filenames: false
        files: \.(tf|tftest\.hcl)$
        require_serial: true

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages:
          - commit-msg
        additional_dependencies:
          - "@commitlint/config-conventional"
